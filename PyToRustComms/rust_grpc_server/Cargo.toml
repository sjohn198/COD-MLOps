[package]
name = "rust_grpc_server"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
tonic = "0.11"
prost = "0.12"
safetensors = "0.7"
tokio = { version = "1.36", features = ["macros", "rt-multi-thread", "full"] }
memmap2 = "0.9"
candle-core = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4.45"


[build-dependencies]
tonic-build = "0.11"

[features]
metal = ["candle-core/metal"]
